<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RLay AI Assistant</title>
    <!-- Marked.js for Code Formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Google Fonts for Myanmar & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            signInWithRedirect, 
            getRedirectResult, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged, 
            setPersistence, 
            browserLocalPersistence 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            where, 
            getDocs, 
            deleteDoc, 
            doc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDOkVig413DDIo1ouusq2qhTIeb3jUMU24",
            authDomain: "rlay-ai-chat.firebaseapp.com",
            databaseURL: "https://rlay-ai-chat-default-rtdb.firebaseio.com",
            projectId: "rlay-ai-chat",
            storageBucket: "rlay-ai-chat.firebasestorage.app",
            messagingSenderId: "615991559092",
            appId: "1:615991559092:web:43ea7ee7b1439ab3dbe8e1",
            measurementId: "G-PM0242NLLE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        setPersistence(auth, browserLocalPersistence).catch(console.error);

        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                console.log("Redirect Login Successful:", result.user);
            }
        }).catch((error) => {
            console.error("Redirect Error:", error);
        });

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user') {
                    try {
                        await signInWithRedirect(auth, provider);
                    } catch (redErr) {
                        alert("Login Error: " + redErr.message);
                    }
                } else {
                    alert("Login Error: " + error.message);
                }
            }
        };

        window.logoutGoogle = async function() {
            try {
                await signOut(auth);
                currentUser = null;
                const authBtn = document.getElementById("authBtn");
                authBtn.innerText = "အကောင့်ဝင်ရန်";
                authBtn.onclick = window.loginWithGoogle;
                loadLocalHistory();
                alert("အကောင့်မှ ထွက်ရှိပြီးပါပြီခင်ဗျာ။");
            } catch(e) {
                console.error("Logout Error:", e);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById("authBtn");
            if (user) {
                currentUser = user;
                authBtn.innerText = "ထွက်မည် (" + (user.displayName ? user.displayName.split(" ")[0] : "User") + ")";
                authBtn.onclick = window.logoutGoogle;
                loadUserHistory();
            } else {
                currentUser = null;
                authBtn.innerText = "အကောင့်ဝင်ရန်";
                authBtn.onclick = window.loginWithGoogle;
                loadLocalHistory();
            }
        });

        window.saveChatHistory = async function(userText, aiReplyText) {
            const chatItem = { userMessage: userText, aiResponse: aiReplyText, timestamp: Date.now() };

            let localData = JSON.parse(localStorage.getItem("rlay_ai_history") || "[]");
            localData.unshift(chatItem);
            localStorage.setItem("rlay_ai_history", JSON.stringify(localData));

            if (currentUser) {
                try {
                    await addDoc(collection(db, "user_chats"), {
                        userId: currentUser.uid,
                        userMessage: userText,
                        aiResponse: aiReplyText,
                        timestamp: serverTimestamp()
                    });
                } catch (e) {
                    console.error("Firestore Save Error: ", e);
                }
            }
            renderHistoryList(localData);
        };

        window.clearAllHistory = async function() {
            if (!confirm("မှတ်တမ်း အားလုံးကို ဖျက်ရန် သေချာပါသလား?")) return;

            localStorage.removeItem("rlay_ai_history");

            if (currentUser) {
                try {
                    const q = query(collection(db, "user_chats"), where("userId", "==", currentUser.uid));
                    const querySnapshot = await getDocs(q);
                    const deletePromises = [];
                    querySnapshot.forEach((document) => {
                        deletePromises.push(deleteDoc(doc(db, "user_chats", document.id)));
                    });
                    await Promise.all(deletePromises);
                } catch (e) {
                    console.error("Error clearing Firebase history:", e);
                }
            }

            renderHistoryList([]);
            alert("မှတ်တမ်းများ အားလုံးကို ရှင်းလင်းပြီးပါပြီခင်ဗျာ။");
        };

        function loadLocalHistory() {
            let localData = JSON.parse(localStorage.getItem("rlay_ai_history") || "[]");
            renderHistoryList(localData);
        }

        async function loadUserHistory() {
            if (!currentUser) return loadLocalHistory();
            try {
                const q = query(collection(db, "user_chats"), where("userId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                let docs = [];
                querySnapshot.forEach(doc => docs.push(doc.data()));
                docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if (docs.length > 0) {
                    renderHistoryList(docs);
                } else {
                    loadLocalHistory();
                }
            } catch (e) {
                console.error("Cloud History Error:", e);
                loadLocalHistory();
            }
        }

        function renderHistoryList(items) {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            items.forEach((data) => {
                const item = document.createElement("div");
                item.className = "history-item";
                item.innerText = data.userMessage;
                item.onclick = () => {
                    window.renderHistoricalChat(data.userMessage, data.aiResponse);
                    window.toggleSidebar();
                };
                historyList.appendChild(item);
            });
        }
    </script>

    <style>
        * { box-sizing: border-box; font-family: 'Noto Sans Myanmar', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            background-color: #131314; 
            color: #e3e3e3; 
            height: 100%;
            height: 100dvh;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .header { 
            padding: 12px 16px; 
            background: #1e1f20; 
            border-bottom: 1px solid #2e2f31; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h3 { margin: 0; color: #a8c7fa; font-size: 16px; font-weight: 600; }
        .menu-btn, .auth-btn, .new-chat-btn, .clear-btn { background: #282a2c; border: 1px solid #333; color: #e3e3e3; padding: 6px 12px; border-radius: 18px; font-size: 13px; cursor: pointer; }
        .auth-btn { background: #a8c7fa; color: #040c1e; font-weight: bold; border: none; }
        .clear-btn { background: #3b1d1d; color: #f2b8b8; border: 1px solid #602323; margin-top: 8px; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 99; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #1e1f20; border-right: 1px solid #2e2f31; transition: left 0.3s ease; z-index: 100; display: flex; flex-direction: column; padding: 16px; }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
        .history-item { padding: 10px; background: #282a2c; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c4c7c5; }
        .history-item:hover { background: #333537; }

        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y;
            scroll-behavior: smooth;
        }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .user { background: #282a2c; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #1e1f20; color: #c4c7c5; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2e2f31; position: relative; }

        /* Code Block Container with Copy Button */
        .code-container { position: relative; margin: 10px 0; }
        pre { background: #0d0e0f; padding: 14px; border-radius: 8px; overflow-x: auto; border: 1px solid #333; margin: 0; white-space: pre-wrap; word-break: break-all; }
        code { font-family: 'Fira Code', monospace, sans-serif; color: #75beff; font-size: 13.5px; }
        .copy-btn { position: absolute; top: 6px; right: 6px; background: #2e2f31; border: 1px solid #444; color: #a8c7fa; font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; }
        .copy-btn:active { background: #a8c7fa; color: #000; }

        .input-area-wrapper { padding: 12px 16px; background: #131314; border-top: 1px solid #2e2f31; flex-shrink: 0; }
        .input-area { max-width: 800px; margin: 0 auto; display: flex; background: #1e1f20; border-radius: 24px; padding: 6px 8px 6px 16px; border: 1px solid #333; align-items: flex-end; }
        
        textarea#userInput { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            resize: none; 
            max-height: 120px; 
            height: 24px; 
            line-height: 24px;
            padding: 0;
            margin-bottom: 4px;
        }
        button.send-btn { background: #a8c7fa; color: #040c1e; border: none; border-radius: 20px; padding: 8px 18px; font-weight: bold; cursor: pointer; height: 36px; }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4 style="margin:0; color:#a8c7fa;">Chat History</h4>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" style="width: 100%; margin-bottom: 8px;" onclick="startNewChat()">+ စာမျက်နှာအသစ် (New Chat)</button>
        <button class="clear-btn" style="width: 100%; margin-bottom: 12px;" onclick="window.clearAllHistory()">🗑️ မှတ်တမ်းများဖျက်မည် (Clear All)</button>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰ History</button>
            <h3>✨ RLay Developer AI</h3>
        </div>
        <div>
            <button class="auth-btn" id="authBtn">အကောင့်ဝင်ရန်</button>
        </div>
    </div>

    <div id="chat-box">
        <div class="message bot">မင်္ဂလာပါ! ကျွန်တော်က RLay Developer AI ဖြစ်ပါတယ်။ HTML/CSS/JS Coding နဲ့ Web-to-App ဖန်တီးမှုတွေမှာ ဘာတွေ ကူညီပေးရမလဲခင်ဗျာ။</div>
    </div>

    <div class="input-area-wrapper">
        <div class="input-area">
            <textarea id="userInput" placeholder="Coding သို့မဟုတ် တစ်ခုခု မေးမြန်းပါ..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
        </div>
    </div>

    <script>
        const GROQ_API_KEYS = [
            "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",
            "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"
        ];

        let currentKeyIndex = 0;

        function getApiKey() {
            return GROQ_API_KEYS[currentKeyIndex];
        }

        function rotateApiKey() {
            currentKeyIndex = (currentKeyIndex + 1) % GROQ_API_KEYS.length;
        }

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function startNewChat() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="message bot">မင်္ဂလာပါ! စာမျက်နှာအသစ် စတင်လိုက်ပါပြီ။ ဘာတွေ ကူညီပေးရမလဲခင်ဗျာ။</div>`;
            toggleSidebar();
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        window.renderHistoricalChat = function(userMsg, aiReply) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `
                <div class="message user">${escapeHtml(userMsg)}</div>
                <div class="message bot">${formatAiMessage(aiReply)}</div>
            `;
        };

        // System Prompt Fix for Bilingual Expertise (English + Myanmar)
        async function fetchGroqAI(text, retryCount = 0) {
            if (retryCount >= GROQ_API_KEYS.length) {
                throw new Error("RATE_LIMIT_EXCEEDED");
            }

            const apiKey = getApiKey();
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${apiKey}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        { 
                            role: "system", 
                            content: "You are RLay Developer AI, a highly proficient software engineer and coding assistant. You excel at answering clearly, politely, and accurately in both Myanmar and English languages according to the user's input language." 
                        },
                        { role: "user", content: text }
                    ],
                    temperature: 0.7,
                    max_tokens: 1024
                })
            });

            const data = await res.json();

            if (data.error) {
                rotateApiKey();
                return await fetchGroqAI(text, retryCount + 1);
            }

            return data;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            
            input.value = "";
            input.style.height = "24px";

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const data = await fetchGroqAI(text);
                
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    
                    chatBox.innerHTML += `<div class="message bot">${formatAiMessage(aiReply)}</div>`;

                    if (window.saveChatHistory) {
                        window.saveChatHistory(text, aiReply);
                    }
                } else {
                    chatBox.innerHTML += `<div class="message bot" style="color:#ff8080;">တုံ့ပြန်မှု ရယူရာတွင် အဆင်မပြေပါခင်ဗျာ။ ထပ်မံ ကြိုးစားကြည့်ပါ။</div>`;
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error("Fetch Error:", err);
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();

                let errorDisplay = "ကွန်ရက် ချိတ်ဆက်မှု အခက်အခဲ ရှိနေပါသည်။ ခဏစောင့်ပြီး ထပ်မံ ကြိုးစားပေးပါ။";
                if (err.message === "RATE_LIMIT_EXCEEDED") {
                    errorDisplay = "⚠️ API Key အဆင်မပြေပါ။ ခဏစောင့်ဆိုင်းပြီး ထပ်မံ ကြိုးစားပေးပါခင်ဗျာ။";
                }
                chatBox.innerHTML += `<div class="message bot" style="color:#ff8080;">${errorDisplay}</div>`;
            }
        }

        // Format Markdown and Add Copy Buttons to Code Blocks
        function formatAiMessage(text) {
            let html = marked.parse(text);
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = html;

            const pres = tempDiv.querySelectorAll("pre");
            pres.forEach((pre) => {
                const wrapper = document.createElement("div");
                wrapper.className = "code-container";
                
                const copyBtn = document.createElement("button");
                copyBtn.className = "copy-btn";
                copyBtn.innerText = "Copy";
                copyBtn.onclick = function() {
                    const codeText = pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText;
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.innerText = "Copied!";
                        setTimeout(() => copyBtn.innerText = "Copy", 2000);
                    });
                };

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);
                wrapper.appendChild(copyBtn);
            });

            return tempDiv.innerHTML;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
